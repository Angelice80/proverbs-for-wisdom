<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Proverbs For Wisdom</title>
<script>
  /* Short links: /17-3 opens the lesson for Proverbs 17:3 on the home page. */
  (function () {
    var p = location.pathname;
    var m = p.match(/\/(\d{1,2})-(\d{1,3})\/?$/);
    if (m) location.replace(p.slice(0, p.length - m[0].length) + "/#" + m[1] + "-" + m[2]);
  })();
</script>
<style>
  @font-face { font-family: "Schibsted Grotesk"; font-weight: 600 800; font-display: swap; src: url("/proverbs-for-wisdom/assets/fonts/schibsted-grotesk-normal-600.woff2") format("woff2"), url("/assets/fonts/schibsted-grotesk-normal-600.woff2") format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 400 700; font-display: swap; src: url("/proverbs-for-wisdom/assets/fonts/atkinson-hyperlegible-next-normal-400.woff2") format("woff2"), url("/assets/fonts/atkinson-hyperlegible-next-normal-400.woff2") format("woff2"); }
  :root { --navy: #15244a; --navy-950: #0d1730; --gold: #e2a73a; --gold-300: #f2cf86; --on-navy: #f6f2ea; --on-navy-2: #c3cce0; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--navy); color: var(--on-navy); font: 1.125rem/1.6 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  ::selection { background: var(--gold-300); color: var(--navy-950); }
  main { max-width: 34rem; }
  .mark { font-family: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 1.125rem; color: var(--gold-300); margin: 0 0 28px; }
  h1 { font-family: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance; }
  p { color: var(--on-navy-2); margin: 0 0 28px; }
  a { display: inline-block; background: var(--gold); color: var(--navy-950); font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 6px; }
  a:hover { background: var(--gold-300); }
  a:focus-visible { outline: 3px solid var(--on-navy); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <p class="mark">Proverbs For Wisdom</p>
    <h1>We couldn't find that page.</h1>
    <p>If you typed a lesson address, check the numbers, like 17-3.</p>
    <a id="home" href="./">Go to Proverbs For Wisdom</a>
  </main>
  <script>
    /* On GitHub Pages this page can be served from any depth, so point Home at the site root. */
    var seg = location.pathname.split("/").filter(Boolean);
    if (location.hostname.endsWith("github.io") && seg.length) document.getElementById("home").href = "/" + seg[0] + "/";
    else document.getElementById("home").href = "/";
  </script>
</body>
</html>
